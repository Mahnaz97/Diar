<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">

    <title>Deyar ديار | A Heritage You Carry</title>
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Site styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
     <div class="announcement-banner">
        Handcrafted Luxury Supporting Women Artisans in Afghanistan &bull; Free Global Shipping Over 3000:-

    <header>
         <!-- Text and Logo -->
        <div class="nav-container">
            <a href="#home" class="logo">
                <img src="images/Deyar-logo.png" alt="Diar logo" class="logo-img">
                <div class="logo-text">
                    <div class="logo-main">Diar</div>
                    <div class="logo-sub">ديار</div>
                </div>
            </a>

             <!-- Menu -->
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#collections">Collections</a></li>
                <li><a href="#all-products">All Products</a></li>
                <li><a href="#about">About us</a></li>
                <li><a href="#artisans">Hands behind the thread</a></li>
                <li><a href="#contact">Contact us</a></li>
            </ul>

             <!-- Language options select -->
            <div class="nav-right">
                <select class="lang-select" aria-label="Select Language">
                    <option value="en">English</option>
                    <option value="sv">Svenska</option>
                    <option value="fa">فارسی</option>
                </select>

                 <!-- Wishlist -->
                <button class="icon-btn" id="wishlistBtn" aria-label="Wishlist">

                <button class="icon-btn" id="cartBtn" aria-label="Shopping Bag">

                </button>
